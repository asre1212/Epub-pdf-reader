name = "marginalia-sync"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Created with:  npx wrangler d1 create marginalia-sync
# Paste the database_id the command prints into the line below.
[[d1_databases]]
binding = "DB"
database_name = "marginalia-sync"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# Comma-separated list of origins allowed to call the API, or "*" for any.
# Narrow this to your own site once it is deployed.
ALLOWED_ORIGINS = "*"
